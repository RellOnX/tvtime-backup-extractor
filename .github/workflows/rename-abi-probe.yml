name: Synthetic guard numeric report only

on:
  push:
    branches: [test/rename-abi-probe]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONWARNINGS: "error::ResourceWarning"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  report:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out test-only source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.12"
          architecture: x64
      - name: Install hash-locked runtime dependencies
        shell: powershell
        run: |
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements.lock
          if ($LASTEXITCODE -ne 0) { throw "Pinned dependency setup failed." }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Pinned dependency graph failed." }
      - name: Capture one guard error and stop
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP "synthetic-guard-report"
          if (Test-Path -LiteralPath $root) { throw "Report destination must be fresh." }
          New-Item -ItemType Directory -Path $root | Out-Null
          python -m tests.guard_error_report --summary (Join-Path $root "guard-report.json")
          if ($LASTEXITCODE -ne 0) { throw "Report-only check stopped with a fixture or guard failure; no retry." }
      - name: Upload fixed-category numeric report only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: synthetic-guard-error-report
          path: ${{ runner.temp }}/synthetic-guard-report/guard-report.json
          if-no-files-found: warn
          retention-days: 7
